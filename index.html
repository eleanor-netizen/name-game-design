<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Name Game</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
<div id="app">

  <!-- HOME SCREEN -->
  <section id="screen-home" class="screen">
    <div class="home-card">
      <h1>Name Game</h1>
      <p class="tagline">How many names can you find?</p>

      <div class="option-group">
        <h2>Mode</h2>
        <div class="option-row" id="mode-options">
          <button type="button" class="option-btn selected" data-mode="blitz">
            <span class="option-title">Alphabet Blitz</span>
            <span class="option-desc">Name as many people as you can starting with one letter.</span>
          </button>
          <button type="button" class="option-btn" data-mode="chain">
            <span class="option-title">Name Chain</span>
            <span class="option-desc">Spell out a seed name, one valid name per letter.</span>
          </button>
        </div>
      </div>

      <div class="option-group">
        <h2>Timer</h2>
        <div class="option-row" id="timer-options">
          <button type="button" class="option-btn selected" data-timer="untimed">Untimed</button>
          <button type="button" class="option-btn" data-timer="60">60 seconds</button>
          <button type="button" class="option-btn" data-timer="90">90 seconds</button>
        </div>
      </div>

      <button id="start-btn" class="primary-btn">Start Game</button>

      <div id="session-summary" class="session-summary hidden">
        <span id="session-summary-text"></span>
        <button id="new-session-btn" class="link-btn">Start New Session</button>
      </div>
    </div>
  </section>

  <!-- GAME SCREEN -->
  <section id="screen-game" class="screen hidden">
    <header class="game-header">
      <div class="header-left">
        <div class="mode-label" id="mode-label"></div>
        <div class="prompt-display" id="prompt-display"></div>
      </div>
      <div class="header-right">
        <div class="timer-display hidden" id="timer-display">60</div>
        <div class="score-display">Score<br /><span id="score-total">0</span></div>
        <button id="end-round-btn" class="secondary-btn">End Round</button>
      </div>
    </header>

    <div class="game-body">
      <main class="play-area">
        <form id="submit-form" autocomplete="off">
          <input
            type="text"
            id="name-input"
            autocomplete="off"
            autocapitalize="words"
            spellcheck="false"
            placeholder="Type a name and press Enter..."
          />
        </form>
        <div id="feedback-chip-zone"></div>
        <div id="round-list" class="round-list"></div>
      </main>

      <aside class="sidebar" id="sidebar">
        <h3>Used Names <span id="used-count" class="used-count"></span></h3>
        <div class="legend">
          <span class="legend-item"><i class="tier-dot tier-1"></i>1x</span>
          <span class="legend-item"><i class="tier-dot tier-2"></i>2x</span>
          <span class="legend-item"><i class="tier-dot tier-3"></i>3x</span>
          <span class="legend-item"><i class="tier-dot tier-4"></i>4x</span>
        </div>
        <ul id="used-names-list" class="used-names-list"></ul>
      </aside>
    </div>
  </section>

  <!-- SUMMARY SCREEN -->
  <section id="screen-summary" class="screen hidden">
    <div class="home-card">
      <h1>Round Complete</h1>
      <div class="summary-stats">
        <div class="stat">
          <span class="stat-value" id="summary-count">0</span>
          <span class="stat-label">Names Found</span>
        </div>
        <div class="stat">
          <span class="stat-value" id="summary-score">0</span>
          <span class="stat-label">Round Score</span>
        </div>
        <div class="stat">
          <span class="stat-value" id="summary-rarest">—</span>
          <span class="stat-label">Rarest Name</span>
        </div>
      </div>
      <p class="session-total-line">Session total score: <strong id="summary-session-score">0</strong></p>
      <button id="play-again-btn" class="primary-btn">Play Again</button>
      <button id="change-mode-btn" class="secondary-btn">Change Mode</button>
    </div>
  </section>

</div>

<script src="data/names-data.js"></script>
<script src="data/variants-data.js"></script>
<script src="js/game.js"></script>
<script src="js/app.js"></script>
</body>
</html>
